name: iOS Login QA

on:
  push:
    branches:
      - codex/vault-version-read-limit

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package Login QA
        shell: bash
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.github.gallhall.venerav.syncloginqa' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Venera Login QA' "$app/Info.plist"
          mkdir -p build/ios/iphoneos/Payload result
          mv "$app" build/ios/iphoneos/Payload/
          artifact="$PWD/result/venera-login-qa-${GITHUB_SHA:0:12}.ipa"
          cd build/ios/iphoneos
          zip -qr "$artifact" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: venera-login-qa-ipa
          path: result/*.ipa
          if-no-files-found: error
