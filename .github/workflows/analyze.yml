name: "analyze"
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: flutter pub get
      - uses: invertase/github-action-dart-analyzer@v1
      # Tests of the features kept in SQLite (稍后看, 时长记录, 阅读活动) and of the
      # history search and statistics. They skip without libsqlite3.so.
      - run: sudo apt-get install -y libsqlite3-dev
      - run: >-
          flutter test
          test/watch_later_test.dart
          test/duration_records_test.dart
          test/history_filter_test.dart
          test/reading_stats_test.dart
          test/reading_activity_test.dart
          test/work_subject_test.dart
          test/watch_later_migration_test.dart
