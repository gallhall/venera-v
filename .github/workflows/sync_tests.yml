name: "sync tests"
# The sync Merger and canonical hashes must agree on every platform
# (docs/sync/testing.md P14), so these pure tests run on all three CI hosts.
on:
  pull_request:
    paths:
      - "lib/foundation/sync/**"
      - "test/sync/**"
      - ".github/workflows/sync_tests.yml"
  push:
    branches:
      - master
    paths:
      - "lib/foundation/sync/**"
      - "test/sync/**"
      - ".github/workflows/sync_tests.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # flutter-version-file needs yq, which flutter-action installs from
      # Chocolatey on Windows; when that feed is down the job cannot start.
      # Read environment.flutter from pubspec.yaml here instead.
      - id: flutter
        shell: bash
        run: |
          v=$(sed -n 's/^  flutter: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ steps.flutter.outputs.version }}
      - run: flutter pub get
      # sync.db tests need a system sqlite3: macOS has one, Ubuntu needs the
      # package; on Windows they skip (no sqlite3.dll outside an app build).
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libsqlite3-dev
      - run: flutter test test/sync/
