name: Build ALL
run-name: Build ALL
on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  Build_MacOS:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v3
      - name: Set version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: bash .github/scripts/set_version.sh "${{ github.ref_name }}"
      - name: Write build-time credentials
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: python3 .github/scripts/dart_defines.py || python .github/scripts/dart_defines.py
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
        # Step 1: Decode and install the certificate, if there is one;
        # without it the app is signed ad hoc.
      - name: Decode and install certificate
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then echo "No certificate, skipped"; exit 0; fi
          echo "$CERTIFICATE" | base64 --decode > signing_certificate.p12
          security import signing_certificate.p12 -k ~/Library/Keychains/login.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign

      - name: Check rust-toolchain.toml
        run: rustup show

      # Step 2: Build the Flutter macOS app
      - name: Build Flutter macOS App
        run: flutter build macos --release --dart-define-from-file=dart_defines.json

      # Step 3: Create the DMG file
      - name: Create DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          cp -R build/macos/Build/Products/Release/venera-v.app dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "venera-v" -srcfolder dist/dmg_contents -ov -format UDZO "dist/venera-v.dmg"

      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv dist/venera-v.dmg result/venera-v-$APP_VERSION.dmg

      # Step 4: Attach and upload artifacts (optional)
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos_build
          path: result/
  Build_IOS:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v3
      - name: Set version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: bash .github/scripts/set_version.sh "${{ github.ref_name }}"
      - name: Write build-time credentials
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: python3 .github/scripts/dart_defines.py || python .github/scripts/dart_defines.py
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define-from-file=dart_defines.json
      - run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -r venera-v-ios.ipa Payload
      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv build/ios/iphoneos/venera-v-ios.ipa result/venera-v-ios-$APP_VERSION.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios_build
          path: result/
  Build_Android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: bash .github/scripts/set_version.sh "${{ github.ref_name }}"
      - name: Write build-time credentials
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: python3 .github/scripts/dart_defines.py || python .github/scripts/dart_defines.py
      - run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - name: Decode and install certificate
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
            echo "$STORE_FILE" | base64 --decode > android/keystore.jks
            echo "$PROPERTY_FILE" > android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
      - name: Check rust-toolchain.toml
        run: rustup show
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=dart_defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/apk/release
  Build_Windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: bash .github/scripts/set_version.sh "${{ github.ref_name }}"
      - name: Write build-time credentials
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: python3 .github/scripts/dart_defines.py || python .github/scripts/dart_defines.py
      - name: install dependencies
        run: | 
          choco install yq -y
          pip install httpx
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - name: build
        run: |
          flutter pub get
          python windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows_build
          path: build/windows/Venera-*
  Build_Linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: bash .github/scripts/set_version.sh "${{ github.ref_name }}"
      - name: Write build-time credentials
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: python3 .github/scripts/dart_defines.py || python .github/scripts/dart_defines.py
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libepoxy-dev libasound2-dev
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      # Bundles a Chinese font: many systems have none (e.g. WSL).
      - name: "Patch font"
        run: |
          flutter pub get
          dart run patch/font.dart
      - run: python3 debian/build.py x64
      # flutter_to_arch names the package after the name in pubspec.yaml, which
      # is the Dart package name venera. That clashes with venera's own Arch
      # package, so it runs compiled, with pubspec.yaml naming venera-v (not a
      # valid Dart package name, so `dart run` cannot be used while it does).
      - name: Build the Arch package
        run: |
          F2A=$(jq -r '.packages[] | select(.name == "flutter_to_arch") | .rootUri' .dart_tool/package_config.json)
          dart compile exe --packages=.dart_tool/package_config.json "${F2A#file://}/bin/flutter_to_arch.dart" -o "$RUNNER_TEMP/flutter_to_arch"
          sed -i 's/^name: venera$/name: venera-v/' pubspec.yaml
          "$RUNNER_TEMP/flutter_to_arch"
          sed -i 's/^name: venera-v$/name: venera/' pubspec.yaml
      - run: |
          sudo rm -rf build/linux/arch/app.tar.gz
          sudo rm -rf build/linux/arch/pkg
          sudo rm -rf build/linux/arch/src
          sudo rm -rf build/linux/arch/PKGBUILD
          # Debug symbols, which makepkg packages on its own.
          sudo rm -f build/linux/arch/*-debug-*.pkg.tar.zst
          ls build/linux/arch
      - uses: actions/upload-artifact@v4
        with:
          name: deb_build
          path: build/linux/x64/release/debian
      - uses: actions/upload-artifact@v4
        with:
          name: arch_build
          path: build/linux/arch/
  Build_Linux_ARM64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: bash .github/scripts/set_version.sh "${{ github.ref_name }}"
      - name: Write build-time credentials
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: python3 .github/scripts/dart_defines.py || python .github/scripts/dart_defines.py
      - uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          flutter-version-file: pubspec.yaml
      - run: |
          flutter pub get
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libepoxy-dev libasound2-dev
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      - name: "Patch font"
        run: |
          dart run patch/font.dart
      - run: python3 debian/build.py arm64
      - uses: actions/upload-artifact@v4
        with:
          name: deb_arm64_build
          path: build/linux/x64/release/debian # This is a bug related to flutter_to_debian, but it's not a big deal.

  Release:
    runs-on: ubuntu-22.04
    needs: [Build_MacOS, Build_IOS, Build_Android, Build_Windows, Build_Linux, Build_Linux_ARM64]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos_build
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          name: ios_build
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          name: windows_build
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          name: deb_build
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          name: arch_build
          path: outputs
      - uses: actions/download-artifact@v4
        with:
          name: deb_arm64_build
          path: outputs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            outputs/*.ipa
            outputs/*.dmg
            outputs/*.apk
            outputs/*.zip
            outputs/*.exe
            outputs/*.deb
            outputs/*.zst
            outputs/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The installers are up, so master can now carry the released version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
      # The cloud Bot API takes files of up to 50 MB, the macOS and universal
      # Android installers are larger: a local server takes up to 2000 MB. It
      # needs an api_id and api_hash from my.telegram.org; without them the
      # release is announced without its files.
      - name: Start a local Telegram Bot API server
        id: telegram_api
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "No TELEGRAM_API_ID or TELEGRAM_API_HASH, announcing without files"
            exit 0
          fi
          # A pasted value often carries a space or line break.
          export TELEGRAM_API_ID=$(printf '%s' "$TELEGRAM_API_ID" | tr -d '[:space:]')
          export TELEGRAM_API_HASH=$(printf '%s' "$TELEGRAM_API_HASH" | tr -d '[:space:]')
          if [[ ! "$TELEGRAM_API_ID" =~ ^[0-9]+$ ]]; then
            echo "TELEGRAM_API_ID is not a number" >&2
            exit 1
          fi
          if [[ ! "$TELEGRAM_API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
            echo "TELEGRAM_API_HASH is not 32 hex digits (it has ${#TELEGRAM_API_HASH} characters)" >&2
            exit 1
          fi
          docker run -d --name telegram-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID -e TELEGRAM_API_HASH -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:10.2
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8081/; then
              echo "api=http://localhost:8081" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "The local Bot API server did not start" >&2
          docker logs telegram-bot-api >&2 || true
          exit 1
      # A failed announcement must not stop the version commit below.
      - name: Announce on Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API: ${{ steps.telegram_api.outputs.api }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -n "$TELEGRAM_API" ]; then
            bash repo/.github/scripts/telegram_release.sh "${{ github.ref_name }}" outputs
          else
            bash repo/.github/scripts/telegram_release.sh "${{ github.ref_name }}"
          fi
      - name: Write the version into master
        working-directory: repo
        run: |
          bash .github/scripts/set_version.sh "${{ github.ref_name }}"
          if git diff --quiet; then
            echo "master already has this version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: version ${GITHUB_REF_NAME#v}"
          git push
          # The app checks for updates in this pubspec.yaml through jsDelivr.
          # Right after a push jsDelivr can still see the previous commit and
          # cache the old file again: purge late, and twice.
          BRANCH="${{ github.event.repository.default_branch }}"
          purge() {
            curl -s -o /dev/null -w "purge pubspec.yaml %{http_code}\n" --max-time 10 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${BRANCH}/pubspec.yaml" || true
          }
          sleep 30
          purge
          sleep 120
          purge
